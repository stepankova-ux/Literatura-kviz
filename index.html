:root[data-theme="dark"]{--bg:#16181d;--card:#20242c;--text:#e8e9ee;--muted:#9aa0ae;--accent:#7c93f5;--ok:#69db7c;--okbg:#1d3326;--bad:#ff8787;--badbg:#3a2022;--line:#343a46;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
main{max-width:660px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);font-family:system-ui,sans-serif;font-size:.9rem;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
label{display:block;font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;font:inherit;font-size:1rem;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.meta{display:flex;justify-content:space-between;font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.q{font-size:1.15rem;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:1rem;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.btn{font:inherit;font-family:system-ui,sans-serif;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;font-size:1rem;margin:10px 8px 0 0}
.btn.sec{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.fb{font-family:system-ui,sans-serif;margin:6px 0 4px;font-weight:600}
.ex{font-family:system-ui,sans-serif;font-size:.9rem;color:var(--muted);margin:0 0 8px}
.big{font-size:2.2rem;margin:8px 0}
.note{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.85rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Literatura – procvičování</h1>
<p class="sub">Otázky se losují náhodně z databáze.</p>

<div class="card" id="start">
  <label for="name">Tvoje jméno a třída</label>
  <input id="name" maxlength="60" placeholder="např. Jana Nováková, 4.A" autocomplete="name">
  <label for="cat">Okruh</label>
  <select id="cat"></select>
  <label for="cnt">Počet otázek</label>
  <select id="cnt"><option value="10">10</option><option value="20">20</option><option value="0">Všechny</option></select>
  <div id="err" class="note" style="color:var(--bad)"></div>
  <button class="btn" onclick="start()">Začít</button>
</div>

<div class="card hide" id="quiz">
  <div class="meta"><span id="num"></span><span id="score"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <p class="q" id="qtext"></p>
  <div id="opts"></div>
  <div class="fb" id="fb"></div>
  <p class="ex" id="ex"></p>
  <button class="btn hide" id="next" onclick="next()">Další otázka</button>
</div>

<div class="card hide" id="end">
  <p class="q">Hotovo, <span id="who"></span>!</p>
  <div class="big" id="final"></div>
  <p id="saved" class="note"></p>
  <button class="btn" onclick="start()">Znovu</button>
  <button class="btn sec" onclick="show('start')">Zpět na začátek</button>
</div>

</main>

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function show(id){["start","quiz","end"].forEach(x=>$(x).classList.toggle("hide",x!==id))}

function start(){
  name=$("name").value.trim();

  $("err").textContent="";
  catName=$("cat").value;
  pool=shuffle(DB.filter(d=>!catName||d.c===catName));

  if(n>0)pool=pool.slice(0,n);
  idx=0;right=0;show("quiz");render();
}

  $("next").textContent=idx===pool.length-1?"Zobrazit výsledek":"Další otázka";
  const box=$("opts");box.innerHTML="";
  shuffle(it.o).forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(b,t,it);box.appendChild(b)});
}
function answer(btn,t,it){
  if(answered)return;answered=true;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===it.a)b.classList.add("ok")});
  if(t===it.a){right++;$("fb").textContent="Správně!";$("fb").style.color="var(--ok)"}
  else{btn.classList.add("bad");$("fb").textContent="Chyba. Správně: "+it.a;$("fb").style.color="var(--bad)"}
  $("ex").textContent=it.e||"";
  $("score").textContent="Body: "+right;$("next").classList.remove("hide");
}
async function next(){
  idx++;if(idx<pool.length){render();return}
  const p=Math.round(right/pool.length*100);
  $("who").textContent=name;$("final").textContent=right+" / "+pool.length+" ("+p+" %)";
  show("end");
  const rec={name,cat:catName||"Všechny okruhy",score:right,total:pool.length,pct:p,date:new Date().toISOString()};
  const manual=name+", "+right+"/"+pool.length+" ("+p+" %), "+new Date().toLocaleDateString("cs-CZ");
  if(!SHEETS_URL){$("saved").textContent="Výsledek (opiš ho učiteli): "+manual;return}
  $("saved").textContent="Odesílám výsledek…";
  try{
    await fetch(SHEETS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)});
    $("saved").textContent="Výsledek byl odeslán učiteli.";
  }catch(e){
    $("saved").textContent="Odeslání se nepodařilo. Opiš výsledek učiteli: "+manual;
  }
}
</script>
</body>
</html>
